<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Krazy Wholesale — Billing</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0f12;--surf:#161a20;--surf2:#1e242d;--brd:#2a3140;--acc:#00e5a0;--acc2:#ff6b35;--acc3:#7c6aff;--txt:#e8ecf0;--txt2:#7a8898;--txt3:#4a5568;--danger:#ff4d6d;--warn:#ffb347;--r:10px}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;min-height:100vh}
.app{display:flex;min-height:100vh}
.sidebar{width:210px;min-height:100vh;background:var(--surf);border-right:1px solid var(--brd);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100}
.sidebar-logo{padding:18px 16px 14px;border-bottom:1px solid var(--brd)}
.sidebar-logo img{width:100%;max-width:150px;display:block;margin:0 auto}
.sidebar-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:3px}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--txt2);border:none;background:none;width:100%;text-align:left;transition:all .15s;font-family:inherit}
.nav-btn:hover{background:var(--surf2);color:var(--txt)}
.nav-btn.active{background:rgba(0,229,160,.12);color:var(--acc)}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--brd);font-size:10px;color:var(--txt3)}
.main{margin-left:210px;flex:1;padding:28px;min-height:100vh}
.card{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-header h3{font-size:14px;font-weight:700;color:var(--txt)}
.page-hdr{margin-bottom:22px}
.page-hdr h2{font-size:22px;font-weight:800}
.page-hdr p{font-size:12px;color:var(--txt2);margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s;white-space:nowrap;font-family:inherit}
.btn-primary{background:var(--acc);color:#0d0f12}.btn-primary:hover{background:#00c589}
.btn-secondary{background:var(--surf2);color:var(--txt);border:1px solid var(--brd)}.btn-secondary:hover{border-color:var(--acc);color:var(--acc)}
.btn-danger{background:rgba(255,77,109,.1);color:var(--danger);border:1px solid rgba(255,77,109,.2)}.btn-danger:hover{background:rgba(255,77,109,.2)}
.btn-purple{background:var(--acc3);color:#fff}.btn-purple:hover{background:#6a59e0}
.btn-sm{padding:4px 9px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.form-row{display:grid;gap:12px;margin-bottom:12px}
.form-row.c2{grid-template-columns:1fr 1fr}.form-row.c3{grid-template-columns:1fr 1fr 1fr}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select,.fg textarea{background:var(--surf2);border:1px solid var(--brd);border-radius:6px;color:var(--txt);font-size:12px;padding:8px 10px;outline:none;transition:border-color .15s;font-family:inherit}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--acc)}
.fg textarea{resize:vertical;min-height:65px}
select option{background:var(--surf2)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead tr{border-bottom:1px solid var(--brd)}
thead th{padding:9px 10px;text-align:left;font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.6px;font-weight:500}
tbody tr{border-bottom:1px solid var(--brd)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--surf2)}
tbody td{padding:10px;color:var(--txt)}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:500}
.b-tax{background:rgba(255,107,53,.15);color:var(--acc2)}
.b-ntax{background:rgba(124,106,255,.15);color:var(--acc3)}
.b-ok{background:rgba(0,229,160,.12);color:var(--acc)}
.b-warn{background:rgba(255,179,71,.12);color:var(--warn)}
.tag{display:inline-block;background:var(--surf2);border:1px solid var(--brd);border-radius:4px;padding:2px 6px;font-size:10px;color:var(--txt2)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal{background:var(--surf);border:1px solid var(--brd);border-radius:13px;padding:24px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
.modal-wide{max-width:820px}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-hdr h3{font-size:17px;font-weight:700}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:16px;border-top:1px solid var(--brd)}
.xbtn{background:none;border:none;color:var(--txt2);cursor:pointer;font-size:20px;line-height:1;padding:2px}
.xbtn:hover{color:var(--txt)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:16px}
.stat .lbl{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.7px}
.stat .val{font-size:24px;font-weight:800;margin-top:4px}
.tabs{display:flex;gap:3px;background:var(--surf2);border-radius:7px;padding:3px;margin-bottom:16px;flex-wrap:wrap}
.tbtn{padding:6px 14px;border-radius:5px;border:none;cursor:pointer;font-size:12px;color:var(--txt2);background:none;transition:all .15s;font-family:inherit}
.tbtn:hover{color:var(--txt)}
.tbtn.active{background:var(--surf);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.inv-inp{background:var(--bg);border:1px solid var(--brd);border-radius:5px;color:var(--txt);font-size:12px;padding:5px 7px;width:100%;outline:none;font-family:inherit}
.inv-inp:focus{border-color:var(--acc)}.inv-inp.err{border-color:var(--danger)}
.tots{background:var(--surf2);border-radius:8px;padding:14px;margin-top:12px}
.tl{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--txt2)}
.tl.grand{font-size:15px;font-weight:700;color:var(--txt);border-top:1px solid var(--brd);padding-top:9px;margin-top:5px}
.vmsg{font-size:11px;margin-top:10px;padding:9px 12px;border-radius:6px}
.v-ok{background:rgba(0,229,160,.1);color:var(--acc);border:1px solid rgba(0,229,160,.2)}
.v-err{background:rgba(255,77,109,.1);color:var(--danger);border:1px solid rgba(255,77,109,.2)}
.v-warn{background:rgba(255,179,71,.1);color:var(--warn);border:1px solid rgba(255,179,71,.2)}
.prog-bar{height:5px;background:var(--surf2);border-radius:10px;overflow:hidden;margin:8px 0}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc3));border-radius:10px;transition:width .4s}
.empty{text-align:center;padding:40px 20px;color:var(--txt3)}
.empty .icon{font-size:32px;margin-bottom:8px}
.fr{display:flex;align-items:center;gap:8px}
.fb{display:flex;align-items:center;justify-content:space-between}
.log-box{max-height:200px;overflow-y:auto;font-size:11px;font-family:monospace}
.log-line{padding:3px 8px;border-bottom:1px solid var(--brd);display:flex;gap:10px}
a{color:var(--acc3)}
input[type=checkbox]{accent-color:var(--acc);width:14px;height:14px}
code{background:var(--surf2);padding:1px 6px;border-radius:3px;font-size:11px;color:var(--acc)}
@media(max-width:640px){
  .sidebar{width:54px}
  .sidebar-logo,.sidebar-footer,.nav-btn span:last-child{display:none}
  .nav-btn{justify-content:center;padding:12px}
  .main{margin-left:54px;padding:14px}
  .stats{grid-template-columns:1fr 1fr}
  .form-row.c2,.form-row.c3{grid-template-columns:1fr}
}
</style>
</head>

function buildXLSX(invs){
  var wb=XLSX.utils.book_new();
  var h1=[['Invoice #','Date','Customer','Type','SubTotal','Tax','Total','Items']];
  invs.forEach(function(v){h1.push([v.number,v.date,v.customerName,v.type==='taxable'?'Taxable':'Non-Taxable',v.subtotal,v.taxAmount,v.grandTotal,v.lineItems.length]);});
  var ws1=XLSX.utils.aoa_to_sheet(h1);ws1['!cols']=[{wch:16},{wch:12},{wch:24},{wch:12},{wch:12},{wch:12},{wch:14},{wch:8}];
  XLSX.utils.book_append_sheet(wb,ws1,'Invoice Master');
  var h2=[['Invoice #','Date','Customer','Item','Qty','Rate','Total']];
  invs.forEach(function(v){v.lineItems.forEach(function(l){h2.push([v.number,v.date,v.customerName,l.name,l.qty,l.rate,l.qty*l.rate]);});});
  var ws2=XLSX.utils.aoa_to_sheet(h2);ws2['!cols']=[{wch:16},{wch:12},{wch:24},{wch:26},{wch:8},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws2,'Line Items');
  return XLSX.write(wb,{bookType:'xlsx',type:'base64'});
}

function buildHTML(inv){
  var rows=inv.lineItems.map(function(l){return '<tr><td style="padding:7px 10px">'+l.name+'</td><td style="text-align:right;padding:7px 10px">$'+parseFloat(l.rate).toFixed(2)+'</td><td style="text-align:right;padding:7px 10px">'+l.qty+'</td><td style="text-align:right;padding:7px 10px;font-weight:700">$'+(l.qty*l.rate).toFixed(2)+'</td></tr>';}).join('');
  var empty='';for(var i=0;i<Math.max(0,8-inv.lineItems.length);i++)empty+='<tr><td style="height:20px"></td><td></td><td></td><td></td></tr>';
  var tx=inv.type==='taxable'?'<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:11px"><span>Tax ('+inv.taxPct+'%)</span><strong>$'+inv.taxAmount.toFixed(2)+'</strong></div>':'<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:11px"><span>Tax</span><strong>$0.00</strong></div>';
  var css='*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;padding:26px;width:780px}.hdr{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:12px;border-bottom:3px solid #1a5ca8}.bill{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #ddd}table{width:100%;border-collapse:collapse;font-size:11px}thead tr{background:#f0f4fa;border-bottom:2px solid #1a5ca8}thead th{padding:7px 10px;text-align:left;font-size:10px;font-weight:700;color:#1a5ca8;text-transform:uppercase}thead th.r{text-align:right}tbody tr{border-bottom:1px dotted #ddd}.ftr{display:grid;grid-template-columns:1fr 195px;border-top:2px solid #1a5ca8}.pgftr{background:#f0f4fa;border-top:1px solid #ddd;padding:7px;text-align:center;font-size:10px;font-style:italic}';
  return '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>'+css+'</style></head><body><div class="hdr"><img src="'+LOGO+'" style="height:46px;max-width:190px;object-fit:contain"><div style="text-align:right"><div style="font-size:20px;font-weight:900;color:#1a5ca8">INVOICE</div><div style="font-size:12px;color:#333;font-weight:600">#'+inv.number+'</div><div style="font-size:10px;color:#444">5903 Angel Fall Lane, Houston TX 77041</div></div></div><div class="bill"><div style="padding:10px 14px 10px 0;border-right:1px solid #ddd"><div style="font-size:9px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Bill To</div><strong style="font-size:12px;display:block">'+inv.customerName+'</strong><span style="font-size:10px;color:#444;display:block">'+(inv.contactName||'')+'</span><span style="font-size:10px;color:#444;display:block">'+(inv.address||'').replace(/\n/g,'<br>')+'</span></div><div style="padding:10px 0 10px 14px;font-size:11px"><div style="margin-bottom:6px"><span style="font-size:9px;color:#888;text-transform:uppercase">Date</span><div style="font-weight:600">'+inv.date+'</div></div><div><span style="font-size:9px;color:#888;text-transform:uppercase">Type</span><div style="font-weight:600;color:'+(inv.type==='taxable'?'#c45200':'#5a3fbf')+'">'+(inv.type==='taxable'?'Taxable':'Non-Taxable')+'</div></div></div></div><table><thead><tr><th style="width:50%">Description</th><th class="r">Unit Price</th><th class="r">Qty</th><th class="r">Amount</th></tr></thead><tbody>'+rows+empty+'</tbody></table><div class="ftr"><div style="padding:10px 14px 10px 0;border-right:1px solid #ddd"><div style="font-size:9px;color:#888;text-transform:uppercase;margin-bottom:4px">Office Use Only</div><div style="border:1px solid #ccc;height:54px;background:#f9f9f9;border-radius:2px"></div></div><div style="padding:10px 0 10px 14px;display:flex;flex-direction:column;gap:3px"><div style="display:flex;justify-content:space-between;font-size:11px"><span>SubTotal</span><strong>$'+inv.subtotal.toFixed(2)+'</strong></div>'+tx+'<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:900;color:#1a5ca8;border-top:2px solid #1a5ca8;padding-top:5px;margin-top:3px"><span>TOTAL</span><span>$'+inv.grandTotal.toFixed(2)+'</span></div></div></div><div class="pgftr"><div>Please make Check Payable to <strong style="color:#1a5ca8">KRAZY WHOLESALE LLC</strong></div><div style="margin-top:3px;font-size:10px;color:#1a5ca8;font-style:normal;font-weight:600">Zelle: contact@krazywholesale.com</div></div></body></html>';
}

function pkce_random(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return btoa(String.fromCharCode.apply(null,a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');}

// Google Drive PKCE
var GDrive=(function(){
  var TOK='gd_tok',EXP='gd_exp';

  function isValid(){
    var tok=localStorage.getItem(TOK);
    return !!tok&&tok.length>10&&Date.now()<parseInt(localStorage.getItem(EXP)||'0');
  }
  function saveTok(access_token,expires_in){
    localStorage.setItem(TOK,access_token);
    localStorage.setItem(EXP,String(Date.now()+(parseInt(expires_in)||3599)*1000-120000));
  }
  function clear(){
    [TOK,EXP,'gd_mid','gd_data_fid'].forEach(function(k){localStorage.removeItem(k);});
  }

  function loadGIS(cb){
    if(window.google&&window.google.accounts){cb(null);return;}
    var s=document.createElement('script');
    s.src='https://accounts.google.com/gsi/client';
    s.async=true;s.defer=true;
    s.onload=function(){cb(null);};
    s.onerror=function(){cb(new Error('Failed to load Google Identity Services'));};
    document.head.appendChild(s);
  }

  // GIS Token Model — no client_secret, no PKCE token exchange
  // Google handles everything internally via the GIS popup
  function getToken(clientId,cb){
    if(isValid()){cb(localStorage.getItem(TOK),null);return;}
    localStorage.setItem('gd_cid',clientId);
    loadGIS(function(err){
      if(err){cb(null,err.message);return;}
      try{
        var hint=localStorage.getItem('gd_hint')||'';
        var client=google.accounts.oauth2.initTokenClient({
          client_id:clientId,
          scope:'https://www.googleapis.com/auth/drive.file',
          callback:function(resp){
            if(resp.error){
              cb(null,resp.error+(resp.error_description?': '+resp.error_description:''));
              return;
            }
            if(resp.token_type==='Bearer'&&resp.access_token){
              saveTok(resp.access_token,resp.expires_in||3599);
              // Save email hint so next time we skip account chooser
              if(resp.token&&resp.token.email) localStorage.setItem('gd_hint',resp.token.email);
              cb(resp.access_token,null);
            } else {
              cb(null,'No access token in response');
            }
          },
          error_callback:function(e){
            cb(null,e.type+': '+(e.message||'Authentication failed'));
          }
        });
        // If previously connected, try without showing account chooser
        client.requestAccessToken(hint?{hint:hint,prompt:''}:{prompt:'select_account'});
      }catch(e){cb(null,e.message);}
    });
  }

  function getFolder(name,tok,cb){
    var q="name='"+name.replace(/'/g,"\\'")+"' and mimeType='application/vnd.google-apps.folder' and trashed=false";
    fetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&fields=files(id)',
      {headers:{Authorization:'Bearer '+tok}})
    .then(function(r){return r.json();})
    .then(function(r){
      if(r.files&&r.files.length){cb(null,r.files[0].id);return;}
      fetch('https://www.googleapis.com/drive/v3/files?fields=id',{
        method:'POST',
        headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},
        body:JSON.stringify({name:name,mimeType:'application/vnd.google-apps.folder'})
      }).then(function(r){return r.json();}).then(function(f){cb(null,f&&f.id?f.id:null);}).catch(function(e){cb(e.message);});
    }).catch(function(e){cb(e.message);});
  }

  function upload(tok,folderName,filename,b64,mime,existId,cb){
    var bin=atob(b64),bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    function doUp(parentId){
      var bnd='KWb';
      var meta=JSON.stringify(existId?{name:filename,mimeType:mime}:{name:filename,mimeType:mime,parents:parentId?[parentId]:[]});
      var pre=new TextEncoder().encode('--'+bnd+'\r\nContent-Type: application/json\r\n\r\n'+meta+'\r\n--'+bnd+'\r\nContent-Type: '+mime+'\r\n\r\n');
      var post=new TextEncoder().encode('\r\n--'+bnd+'--');
      var body=new Uint8Array(pre.length+bytes.length+post.length);
      body.set(pre);body.set(bytes,pre.length);body.set(post,pre.length+bytes.length);
      var url=existId
        ?'https://www.googleapis.com/upload/drive/v3/files/'+existId+'?uploadType=multipart&fields=id,name'
        :'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name';
      fetch(url,{method:existId?'PATCH':'POST',
        headers:{Authorization:'Bearer '+tok,'Content-Type':'multipart/related; boundary='+bnd},
        body:body.buffer})
      .then(function(r){return r.json();})
      .then(function(r){cb(r&&r.id?null:(r.error&&r.error.message)||'Upload failed',r&&r.id);})
      .catch(function(e){cb(e.message);});
    }
    if(!folderName){doUp(null);return;}
    getFolder(folderName,tok,function(err,fid){doUp(err?null:fid);});
  }

  function uploadJSON(tok,filename,obj,existId,cb){
    var bytes=new TextEncoder().encode(JSON.stringify(obj));
    var b64=btoa(String.fromCharCode.apply(null,bytes));
    upload(tok,null,filename,b64,'application/json',existId,cb);
  }

  function downloadJSON(tok,fileId,cb){
    fetch('https://www.googleapis.com/drive/v3/files/'+fileId+'?alt=media',
      {headers:{Authorization:'Bearer '+tok}})
    .then(function(r){if(!r.ok){cb('HTTP '+r.status);return null;}return r.text();})
    .then(function(t){if(!t)return;try{cb(null,JSON.parse(t));}catch(e){cb('Parse error: '+e.message);}})
    .catch(function(e){cb(e.message);});
  }

  function findFile(tok,folderName,filename,cb){
    var q="name='"+filename+"' and trashed=false";
    fetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&fields=files(id,name,modifiedTime)&orderBy=modifiedTime+desc',
      {headers:{Authorization:'Bearer '+tok}})
    .then(function(r){return r.json();})
    .then(function(r){cb(null,r.files&&r.files.length?r.files[0]:null);})
    .catch(function(e){cb(e.message);});
  }

  return{isValid:isValid,getToken:getToken,upload:upload,uploadJSON:uploadJSON,downloadJSON:downloadJSON,findFile:findFile,clear:clear};
})();


// OneDrive PKCE
var OneDrive=(function(){
  var OD='e40a53ec-44f9-42b3-b3bc-a7d5db58bf49';
  function isValid(){return!!localStorage.getItem('od_tok')&&Date.now()<parseInt(localStorage.getItem('od_exp')||0);}

    var ver=pkce_random(64),state=pkce_random(16);
    sessionStorage.setItem('pkce_v_'+state,ver);sessionStorage.setItem('pkce_p_'+state,'onedrive');
    var redir=window.location.origin+window.location.pathname;

      var url='https://login.microsoftonline.com/consumers/oauth2/v2.0/authorize?client_id='+encodeURIComponent(OD)+'&redirect_uri='+encodeURIComponent(redir)+'&response_type=code&scope='+encodeURIComponent('Files.ReadWrite offline_access')+'&code_challenge='+ch+'&code_challenge_method=S256&state='+state+'&prompt=select_account';

      if(!pop||pop.closed||typeof pop.closed==='undefined'){window.location.href=url;return;}
      var iv=setInterval(function(){
        try{var href=pop.location.href;
          if(href&&href.indexOf(redir)===0){clearInterval(iv);pop.close();
            var u=new URL(href),code=u.searchParams.get('code'),err=u.searchParams.get('error');
            if(err){cb(null,'Auth denied: '+err);return;}
            if(code){exchangeOD(code,redir,ver,cb);}
          }
        }catch(e){}
      },500);
      setTimeout(function(){clearInterval(iv);if(!pop.closed)pop.close();},300000);
    });
  }
  function exchangeOD(code,redir,ver,cb){
    fetch('https://login.microsoftonline.com/consumers/oauth2/v2.0/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'grant_type=authorization_code&client_id='+encodeURIComponent(OD)+'&code='+encodeURIComponent(code)+'&redirect_uri='+encodeURIComponent(redir)+'&code_verifier='+encodeURIComponent(ver)+'&scope='+encodeURIComponent('Files.ReadWrite offline_access')})
    .then(function(r){return r.json();}).then(function(d){
      if(d.access_token){localStorage.setItem('od_tok',d.access_token);localStorage.setItem('od_exp',String(Date.now()+(parseInt(d.expires_in)||3600)*1000-60000));if(d.refresh_token)localStorage.setItem('od_ref',d.refresh_token);cb(d.access_token,null);}
      else cb(null,d.error_description||d.error||'Token failed');
    }).catch(function(e){cb(null,e.message);});
  }
  function refreshOD(cb){
    var ref=localStorage.getItem('od_ref');if(!ref){cb(null,'No refresh token');return;}
    fetch('https://login.microsoftonline.com/consumers/oauth2/v2.0/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&client_id='+encodeURIComponent(OD)+'&refresh_token='+encodeURIComponent(ref)+'&scope='+encodeURIComponent('Files.ReadWrite offline_access')})
    .then(function(r){return r.json();}).then(function(d){
      if(d.access_token){localStorage.setItem('od_tok',d.access_token);localStorage.setItem('od_exp',String(Date.now()+(parseInt(d.expires_in)||3600)*1000-60000));cb(d.access_token,null);}
      else{clear();cb(null,d.error||'Refresh failed');}
    }).catch(function(e){cb(null,e.message);});
  }
  function getToken(cb){
    if(isValid()){cb(localStorage.getItem('od_tok'),null);return;}
    var ref=localStorage.getItem('od_ref');if(ref){refreshOD(cb);return;}
    doAuth(cb);
  }
  function upload(tok,folderName,filename,b64,cb){
    var bin=atob(b64),bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    var path=folderName?folderName+'/'+filename:filename;

    .then(function(r){return r.json();}).then(function(r){cb(r&&r.id?null:(r.error&&r.error.message)||'Upload failed',r&&r.id);}).catch(function(e){cb(e.message);});
  }
  return{isValid:isValid,getToken:getToken,upload:upload,clear:clear};
})();

  function setItems(v){var val=typeof v==='function'?v(items):v;_setItems(val);lsSet('kw_items',val);scheduleSync();}
  function setRates(v){var val=typeof v==='function'?v(rates):v;_setRates(val);lsSet('kw_rates',val);scheduleSync();}
  function setInvoices(v){var val=typeof v==='function'?v(invoices):v;_setInvoices(val);lsSet('kw_invoices',val);scheduleSync();}
  function setInvS(v){var val=typeof v==='function'?v(invS):v;_setInvS(val);lsSet('kw_invS',val);scheduleSync();}

  function applyDriveData(data){
    function mergeById(local,drive){var m={};local.forEach(function(x){m[x.id]=x;});drive.forEach(function(x){m[x.id]=x;});return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return a.id-b.id;});}
    var merged=mergeById(JSON.parse(localStorage.getItem('kw_invoices')||'[]'),data.invoices||[]);
    _setInvoices(merged);lsSet('kw_invoices',merged);
    var mc=mergeById(JSON.parse(localStorage.getItem('kw_custs')||'[]'),data.customers||[]);
    _setCusts(mc);lsSet('kw_custs',mc);
    var mi=mergeById(JSON.parse(localStorage.getItem('kw_items')||'[]'),data.items||[]);
    _setItems(mi);lsSet('kw_items',mi);
    if(data.rates){_setRates(data.rates);lsSet('kw_rates',data.rates);}
    if(data.invS){_setInvS(data.invS);lsSet('kw_invS',data.invS);}
    return merged.length;
  }

  // Auto-fetch from Drive on startup
  useEffect(function(){
    var cid=localStorage.getItem('gd_cid');
    if(!cid||!GDrive.isValid())return;
    setSyncStatus('loading');
    GDrive.getToken(cid,function(tok,err){
      if(err||!tok){setSyncStatus('idle');return;}
      var dataFid=localStorage.getItem('gd_data_fid');
      function load(fid){
        GDrive.downloadJSON(tok,fid,function(err2,data){
          if(err2||!data){setSyncStatus('error');return;}
          var cnt=applyDriveData(data);
          setSyncStatus('loaded:'+cnt);
        });
      }
      if(dataFid){load(dataFid);}
      else{
        GDrive.findFile(tok,'','kw_data.json',function(err2,file){
          if(err2||!file){setSyncStatus('idle');return;}
          localStorage.setItem('gd_data_fid',file.id);
          load(file.id);
        });
      }
    });
  },[]);

  // Debounced Drive sync — 2s after last change
  var _syncTimer=null;
  function scheduleSync(){
    if(!GDrive.isValid())return;
    clearTimeout(_syncTimer);
    _syncTimer=setTimeout(pushDataToDrive, 2000);
  }
  var NAV=[{id:'dashboard',icon:'\uD83D\uDCCA',lbl:'Dashboard'},{id:'customers',icon:'\uD83D\uDC64',lbl:'Customers'},{id:'items',icon:'\uD83D\uDCE6',lbl:'Item Master'},{id:'rates',icon:'\uD83D\uDCB2',lbl:'Cust. Rates'},{id:'newInvoice',icon:'\u2795',lbl:'New Invoice'},{id:'invoices',icon:'\uD83D\uDCC4',lbl:'Invoices'},{id:'invSettings',icon:'\u2699\uFE0F',lbl:'Inv. Series'},{id:'sync',icon:'\u2601\uFE0F',lbl:'Drive Sync'},{id:'backup',icon:'\uD83D\uDDAB',lbl:'Backup'}];
  return h('div',{className:'app'},
    h('div',{className:'sidebar'},
      h('div',{className:'sidebar-logo'},h('img',{src:LOGO,alt:'Krazy Wholesale'})),
      h('nav',{className:'sidebar-nav'},NAV.map(function(n){return h('button',{key:n.id,className:'nav-btn'+(page===n.id?' active':''),onClick:function(){setPage(n.id);}},h('span',null,n.icon),h('span',null,n.lbl));})),
      h('div',{className:'sidebar-footer'},'Krazy Wholesale LLC')
    ),
    h('div',{className:'main'},
      toast&&h('div',{style:{position:'fixed',top:16,right:16,zIndex:9999,padding:'12px 18px',borderRadius:10,fontSize:13,fontWeight:500,background:toast.type==='ok'?'#00c589':toast.type==='warn'?'#ff9c3a':'#3a9bff',color:'#fff',boxShadow:'0 4px 20px rgba(0,0,0,.35)',maxWidth:340,lineHeight:'1.6'}},toast.msg),
      (syncStatus==='loading')&&h('div',{style:{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',marginBottom:14,background:'rgba(0,229,160,.07)',border:'1px solid rgba(0,229,160,.2)',borderRadius:8,fontSize:12,color:'var(--acc)'}},h('span',null,'⏳'),h('span',null,'Loading data from Google Drive...')),
      (syncStatus.indexOf('loaded')===0)&&h('div',{style:{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',marginBottom:14,background:'rgba(0,229,160,.07)',border:'1px solid rgba(0,229,160,.2)',borderRadius:8,fontSize:12,color:'var(--acc)'}},h('span',null,'✅'),h('span',null,'Loaded '+syncStatus.split(':')[1]+' invoices from Google Drive'),h('button',{style:{marginLeft:'auto',background:'none',border:'none',cursor:'pointer',fontSize:16,color:'var(--txt3)'},onClick:function(){setSyncStatus('idle');}},'×')),
      (syncStatus==='error')&&h('div',{style:{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',marginBottom:14,background:'rgba(255,77,109,.07)',border:'1px solid rgba(255,77,109,.2)',borderRadius:8,fontSize:12,color:'var(--danger)'}},h('span',null,'⚠️'),h('span',null,'Could not load from Drive. Showing local data.'),h('button',{style:{marginLeft:'auto',background:'none',border:'none',cursor:'pointer',fontSize:16,color:'var(--txt3)'},onClick:function(){setSyncStatus('idle');}},'×')),
      page==='dashboard'  &&h(Dashboard,{custs:custs,items:items,invoices:invoices,setPage:setPage}),
      page==='customers'  &&h(Customers,{custs:custs,setCusts:setCusts}),
      page==='items'      &&h(Items,{items:items,setItems:setItems}),
      page==='rates'      &&h(CustRates,{custs:custs,items:items,rates:rates,setRates:setRates}),
      (page==='newInvoice'||page==='editInvoice')&&h(NewInvoice,{custs:custs,items:items,rates:rates,invoices:invoices,setInvoices:setInvoices,setPage:setPage,invS:invS,setInvS:setInvS,setToast:setToast,editInv:editInv,setEditInv:setEditInv}),
      page==='invoices'   &&h(InvoiceList,{invoices:invoices,setInvoices:setInvoices,setPage:setPage,setEditInv:setEditInv}),
      page==='invSettings'&&h(InvSeries,{invS:invS,setInvS:setInvS}),
      page==='sync'       &&h(DriveSync,{invoices:invoices}),
      page==='backup'     &&h(Backup,{custs:custs,items:items,rates:rates,invoices:invoices,invS:invS,setCusts:setCusts,setItems:setItems,setRates:setRates,setInvoices:setInvoices,setInvS:setInvS})
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
})();

</script>
</body>
</html>
